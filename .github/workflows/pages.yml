name: Deploy static website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "favicon.svg"
      - "manifest.webmanifest"
      - "service-worker.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html app.js styles.css favicon.svg manifest.webmanifest service-worker.js dist/
          touch dist/.nojekyll
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
