name: Deploy static website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "lib/**"
      - "styles.css"
      - "favicon.svg"
      - "manifest.webmanifest"
      - "service-worker.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Explain first-time setup
        if: steps.pages.outcome != 'success'
        run: echo "::notice title=One-time setup::Open Settings, then Pages, and select GitHub Actions as the publishing source."
      - name: Prepare static site
        if: steps.pages.outcome == 'success'
        run: |
          mkdir -p dist/lib
          cp index.html app.js styles.css favicon.svg manifest.webmanifest service-worker.js dist/
          cp lib/generator.js dist/lib/
          touch dist/.nojekyll
      - name: Upload static artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish website
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
